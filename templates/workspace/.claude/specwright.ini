# specwright.ini — the one file that describes this project to Specwright.
# Read by every hook and script. Specwright writes it from the interview;
# edit it, never the hooks. Values run to the end of the line, so commands
# may contain pipes, quotes and `=`. Unknown keys are reported by the audit.

[project]
product = __PRODUCT__
# lite | standard | platform — how much ceremony (see references/tiers.md)
tier = __TIER__
# Specwright version that installed these hooks; the audit compares it.
version = __VERSION__
# Locations, relative to this project root. In an EXISTING project they point
# at what already exists; nothing is moved.
docs_dir = __DOCS_DIR__
requirements_dir = __REQUIREMENTS_DIR__
cases_dir = __CASES_DIR__
tests_dir = __TESTS_DIR__
decisions_file = __DECISIONS_FILE__
questions_file = __QUESTIONS_FILE__
lessons_dir = __LESSONS_DIR__
# Feature worktrees are created at ../<worktree_prefix><feature-name>
worktree_prefix = __WORKTREE_PREFIX__
# Seconds the Stop hook allows a unit's typecheck (default 150).
typecheck_timeout = 150
# Base for cloning units that are separate repos (scripts/bootstrap.mjs).
git_base = __GIT_BASE__

# One [unit <name>] per directory with its own toolchain. Any layout works:
# a single repo is one unit at ".", a monorepo one per package, a workspace
# of repos one per repo. The longest matching path owns a file.
#   path       directory, relative to this root ("." = the root)
#   exts       extensions the unit's linter handles
#   lint       lints ONE file; {file} becomes its quoted absolute path
#   typecheck  whole-unit check, run by the Stop hook
#   install    dependency install, run in every fresh worktree
# Omit a key the unit does not have. Examples: references/stacks.md.

[unit __UNIT_NAME__]
path = __UNIT_PATH__
exts = __UNIT_EXTS__
lint = __UNIT_LINT__
typecheck = __UNIT_TYPECHECK__
install = __UNIT_INSTALL__

# The PR gate: steps run IN ORDER by `node scripts/gate.mjs`, cheapest first,
# stopping at the first failure. CI runs the same command. Delete a step only
# with a line in the decision log saying why.
[gate]
lint = __GATE_LINT__
typecheck = __GATE_TYPECHECK__
unit tests = __GATE_TESTS__
