# harness.conf — project-wide settings. Sourced by every hook and script.
# Written by the skill from the interview; edit it, never the hooks.
# Per-unit commands live in harness.units (one line per unit).

PRODUCT="__PRODUCT__"

# Where things live, relative to the harness root (the directory holding this
# .claude/). In an EXISTING project these point at whatever already exists —
# an ADR folder, an existing tests/e2e folder — rather than new directories.
DOCS_DIR="__DOCS_DIR__"                   # e.g. docs
REQUIREMENTS_DIR="__REQUIREMENTS_DIR__"   # e.g. docs/requirements
CASES_DIR="__CASES_DIR__"                 # e.g. e2e/cases   (empty = none yet)
DECISIONS_FILE="__DECISIONS_FILE__"       # e.g. docs/deferred-decisions.md
QUESTIONS_FILE="__QUESTIONS_FILE__"       # e.g. docs/open-questions.md

# Feature worktrees are created at ../<prefix><feature-name>/
WORKTREE_PREFIX="__WORKTREE_PREFIX__"

# The PR gate, run from the harness root. CI runs the same command.
GATE_CMD="__GATE_CMD__"

# Base for `git clone` when units are separate repos (bootstrap.sh).
GIT_BASE="__GIT_BASE__"
